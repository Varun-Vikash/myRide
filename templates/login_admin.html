<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myRide@BIT - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Overlock:ital,wght@0,400;0,700;1,400&family=Yeon+Sung&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #14151b;
            color: #e2e8f0;
            font-family: 'Overlock', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: #1e1f26;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            border: 1px solid #363842;
            box-sizing: border-box;
        }
        .logo-title {
            font-family: 'Yeon Sung', cursive;
            color: mediumslateblue;
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 0.2rem;
            margin-top: 0;
        }
        .role-badge {
            text-align: center;
            color: #cbd5e1;
            font-size: 1.3rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }
        .form-control {
            background-color: #282b37;
            border: 1px solid #363842;
            border-radius: 7px;
            color: #e2e8f0;
            padding: 12px 16px;
            width: 100%;
            font-family: 'Overlock', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: mediumslateblue;
        }
        .btn-login {
            background-color: mediumslateblue;
            color: white;
            border: 1px solid black;
            border-radius: 7px;
            box-shadow: 2px 2px 0 #474A56;
            padding: 12px;
            width: 100%;
            font-family: 'Overlock', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .btn-login:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #474A56;
        }
        .flash-messages {
            color: #ef4444;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.95rem;
        }
        .footer-links {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid #363842;
            padding-top: 1.5rem;
        }
        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 0.5rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: mediumslateblue;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1 class="logo-title">myRide@BIT</h1>
    <div class="role-badge">🛡️ Admin Portal</div>
    
    <div class="flash-messages">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div>{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <form action="/auth/login" method="POST">
        <input type="hidden" name="role" value="admin">
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password">
        </div>
        
        <button type="submit" class="btn-login">Login as Admin</button>
        <button type="button" class="btn-login" style="background:#282b37; border:1px solid #7B68EE; color:#cbd5e1; margin-top:8px; font-size:0.95rem;" onclick="document.getElementById('username').value='admin'; document.getElementById('password').value='admin123';">⚡ Fill Demo Credentials (admin / admin123)</button>
    </form>
    
    <div class="footer-links">
        <a href="/login/driver" target="_blank">🚌 Driver Portal ↗</a> | 
        <a href="/login/student" target="_blank">🎓 Student Portal ↗</a> | 
        <a href="/login">🔑 Portal Hub</a>
    </div>
</div>

</body>
</html>
